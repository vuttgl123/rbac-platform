spring:
  application:
    name: audit-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - classpath:rbac/db-defaults.yaml
      - classpath:rbac/batch-defaults.yaml
  datasource:
    username: ${AUDIT_DB_USER:audit_app}
    password: ${AUDIT_DB_PASSWORD}
server:
  port: 8083
rbac:
  security:
    issuer-prefix: ${IDENTITY_PUBLIC_URL:http://localhost:8081}/t/
    internal-token: ${RBAC_INTERNAL_TOKEN}
    authz-url: ${AUTHZ_URL:http://localhost:8082}
  db:
    expected-role: audit_app
  batch:
    schema: audit
    jobs:
      partition-maintenance:
        cron: "0 0 2 * * *"
