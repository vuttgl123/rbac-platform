spring:
  application:
    name: identity-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - classpath:rbac/db-defaults.yaml
  datasource:
    username: ${IDENTITY_DB_USER:identity_app}
    password: ${IDENTITY_DB_PASSWORD}
server:
  port: 8081
rbac:
  security:
    issuer-prefix: ${IDENTITY_PUBLIC_URL:http://localhost:8081}/t/
    internal-token: ${RBAC_INTERNAL_TOKEN}
    authz-url: ${AUTHZ_URL:http://localhost:8082}
    public-paths: ["/t/*/auth/**", "/t/*/.well-known/**"]
  db:
    expected-role: identity_app
  outbox:
    schema: identity
    publisher: log
