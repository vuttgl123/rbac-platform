spring:
  application:
    name: rbac-platform
  # Local runs read the git-ignored .env next to the working directory; real environment variables win.
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Supabase: the Session pooler JDBC URL, e.g. jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    # Through the Supabase pooler the user is rbac_app.<project-ref>; plain Postgres takes rbac_app.
    username: ${DB_APP_USER:rbac_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      pool-name: rbac-app
      # The Session pooler holds one server connection per client connection; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000 # ms
      data-source-properties:
        ApplicationName: rbac-platform
# Logging is configured in logback-spring.xml.
